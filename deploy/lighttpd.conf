# Reverse-proxy in front of: pf2opn serve -listen 127.0.0.1:8080
# Requires mod_proxy. For a unix socket instead (mode 0660, group www on OPNsense):
#   pf2opn serve -listen unix:/run/pf2opn.sock
#   proxy.server = ( "" => ( ( "host" => "/run/pf2opn.sock" ) ) )

server.modules += ( "mod_proxy" )
server.port = 80
server.document-root = "/var/empty"

$HTTP["url"] =~ "^/" {
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8080 ) ) )
}
